# Builds Fission for Linux, Windows and macOS, self-tests each build on its own OS, and publishes a GitHub release.
#
# Runs automatically when:
#   - a commit lands on main that changes the version in fission.py's header ("Fission X.Y")
#     and there is no release for that version yet -> tags vX.Y and releases it
#   - a tag like v0.7 is pushed -> releases that tag
# It can also be started by hand from the Actions tab (Run workflow).
#
# Linux is built with packaging/linux/build_appimage.sh; Windows and macOS are cross-built on Linux with
# packaging/xbuild/xbuild.py, then each artifact runs "--selftest" on a real Windows / macOS machine before release.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - fission.py
      - packaging/**
      - requirements.txt
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # system libraries Qt / PyOpenGL need on a bare Ubuntu runner (offscreen icon rendering, smoke tests, xvfb)
  LINUX_DEPS: >-
    xvfb xauth libgl1 libegl1 libgl1-mesa-dri libglu1-mesa libxkbcommon0 libxkbcommon-x11-0 libfontconfig1
    libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0
    libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      skip: ${{ steps.ver.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - name: Work out version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          else
            VERSION="$(head -n 20 fission.py | grep -oE 'Fission [0-9]+(\.[0-9]+)+' | head -n1 | cut -d' ' -f2 || true)"
            [ -n "$VERSION" ] || { echo "::error::no 'Fission X.Y' version found in the header of fission.py"; exit 1; }
            TAG="v$VERSION"
          fi
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists - nothing to do (bump the version in fission.py to make a new one)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION, tag $TAG"

  linux:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q $LINUX_DEPS
      - uses: actions/cache@v4
        with:
          path: build/cache
          key: linux-${{ hashFiles('packaging/linux/build_appimage.sh') }}
          restore-keys: linux-
      - name: Build AppImage
        run: |
          ./packaging/linux/build_appimage.sh fission.py -v "$VERSION" -o "dist/Fission-$VERSION-x86_64.AppImage"
          cp "dist/Fission-$VERSION-x86_64.AppImage" dist/fission.AppImage
      - name: Self-test
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 LIBGL_ALWAYS_SOFTWARE=1 timeout 600 \
            xvfb-run -a -s "-screen 0 1920x1080x24" "dist/Fission-$VERSION-x86_64.AppImage" --selftest selftest.txt || true
          cat selftest.txt 2>/dev/null || true
          grep -q "SELFTEST OK" selftest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.AppImage
          if-no-files-found: error

  cross:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q nsis gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 zip
          python -m pip install -q pefile macholib
      - uses: actions/cache@v4
        with:
          path: build/cache
          key: xbuild-${{ hashFiles('packaging/xbuild/xbuild.py') }}
          restore-keys: xbuild-
      - name: Build Windows + macOS
        run: python packaging/xbuild/xbuild.py windows mac-arm64 mac-x86_64 --src fission.py --version "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*-Windows-*
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*-macOS-*
          if-no-files-found: error
          compression-level: 0

  test-windows:
    needs: [version, cross]
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
      - name: Self-test (portable build)
        shell: pwsh
        run: |
          $zip = Get-ChildItem *-portable.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath app
          $st = Join-Path $PWD "selftest.txt"
          $p = Start-Process -FilePath "app\Fission\Fission.exe" -ArgumentList "--selftest", "`"$st`"" -Wait -PassThru
          if (Test-Path $st) { Get-Content $st }
          if ($p.ExitCode -ne 0 -or -not (Select-String -Path $st -Pattern "SELFTEST OK" -Quiet)) { throw "self-test failed (exit $($p.ExitCode))" }
      - name: Installer installs silently
        shell: pwsh
        run: |
          $setup = Get-ChildItem *-Setup.exe | Select-Object -First 1
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer failed (exit $($p.ExitCode))" }
          $exe = Join-Path $env:LOCALAPPDATA "Programs\Fission\Fission.exe"
          if (-not (Test-Path $exe)) { throw "installer didn't put Fission.exe in $exe" }
          $st = Join-Path $PWD "selftest-installed.txt"
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest", "`"$st`"" -Wait -PassThru
          if (Test-Path $st) { Get-Content $st }
          if ($p.ExitCode -ne 0) { throw "installed copy failed its self-test (exit $($p.ExitCode))" }

  test-macos:
    needs: [version, cross]
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos
      - name: Self-test (Apple Silicon)
        run: |
          ditto -x -k Fission-*-macOS-arm64.zip arm64
          codesign --verify --deep --strict arm64/Fission.app
          arm64/Fission.app/Contents/MacOS/Fission -- --selftest "$PWD/selftest-arm64.txt" || true
          cat selftest-arm64.txt 2>/dev/null || true
          grep -q "SELFTEST OK" selftest-arm64.txt
      - name: Self-test (Intel, under Rosetta)
        run: |
          ditto -x -k Fission-*-macOS-x86_64.zip x86_64
          codesign --verify --deep --strict x86_64/Fission.app
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            softwareupdate --install-rosetta --agree-to-license || true
          fi
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "::warning::Rosetta isn't available on this runner - only checked the Intel build's signature"; exit 0
          fi
          arch -x86_64 x86_64/Fission.app/Contents/MacOS/Fission -- --selftest "$PWD/selftest-x86_64.txt" || true
          cat selftest-x86_64.txt 2>/dev/null || true
          grep -q "SELFTEST OK" selftest-x86_64.txt

  release:
    needs: [version, linux, test-windows, test-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          ls -la
          gh release create "$TAG" * -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Fission $VERSION" \
            --generate-notes
